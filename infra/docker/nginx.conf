# Serves the prerendered site and proxies the API.
#
# Everything under / is a static file produced at build time. There is no application server on this
# side — see docs/adr/0002-frontend-rendering.md.
#
# Note the `include snippets/security-headers.conf` in every location that sets a header of its own:
# nginx replaces inherited `add_header` directives rather than merging them, so a location that adds
# one Cache-Control would otherwise drop the entire security policy. See that file.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The server's version is not information a visitor needs.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # --- compression -----------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # --- API -------------------------------------------------------------------------------------
    # Same origin, so the browser needs no CORS at all and the API keeps an empty allowed-origins
    # list in production. No add_header here, so the security snippet is inherited as-is.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $http_accept_language;

        # The page already has its content from the prerender; a slow API must never hold a request
        # open long enough for the visitor to notice.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- caching ---------------------------------------------------------------------------------
    # Hashed filenames can be cached forever: they change name when they change content.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location /cv/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # HTML must not be cached hard: a redeploy has to be visible immediately, and each of these files
    # is prerendered content that changes whenever the content does.
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- routing ---------------------------------------------------------------------------------
    # Every route was prerendered into its own directory with an index.html, so a real file exists
    # for every valid URL. There is deliberately no SPA catch-all rewrite to /index.html: that would
    # answer 200 for URLs that do not exist, hiding broken links from crawlers and from us.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /en/404/index.html;
}
