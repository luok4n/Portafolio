# Security headers, in a snippet because nginx does not merge `add_header` across levels.
#
# A `location` block that declares any `add_header` of its own silently DROPS every header inherited
# from the server block. That is not a warning, not an error, just a response that quietly lost its
# Content-Security-Policy — and `try_files` makes it worse, because the internal redirect to
# /en/index.html re-evaluates locations, so a block that looks unrelated to a request ends up
# handling it.
#
# This file is therefore included both at server level and inside every location that sets a header.
# Verified by checking the actual response, which is the only way this class of bug is ever found:
#
#   curl -sD - -o /dev/null http://localhost:8080/en/

# The site loads nothing from anywhere else: no CDN, no analytics, no external fonts. The policy can
# be strict enough to be worth having rather than the usual permissive one. 'unsafe-inline' remains
# for the hydration and JSON-LD scripts Angular inlines into each prerendered page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
