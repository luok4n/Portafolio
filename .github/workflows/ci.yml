name: CI

# Every check in this pipeline already existed as a script somebody had to remember to run.
# That is the point of moving them here: they now run whether or not anyone remembers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run has nothing useful left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  content:
    name: Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The engineering section's figures are generated from the repository. Regenerating them and
      # requiring no diff proves the committed numbers still describe the code — the failure mode
      # ADR-0005 exists to prevent is a page that quietly claims more tests than there are.
      - name: Engineering facts are current
        run: |
          node tools/engineering/collect-facts.mjs
          git diff --exit-code -- content/engineering-facts.json \
            || (echo "::error::engineering-facts.json is stale. Run node tools/engineering/collect-facts.mjs and commit." && exit 1)

      - name: Validate content
        run: node tools/content/validate.mjs

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the working tree is scanned. History scanning is a different job with different
          # tooling; claiming this covers it would be worse than not having it.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Secrets and privacy scan
        run: node tools/security/scan.mjs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Vulnerable NuGet packages
        working-directory: src/services/portfolio-api
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          # Written as an if on purpose. `grep -q X && (exit 1) || true` always succeeds — a gate
          # that reports green while finding vulnerabilities is worse than no gate.
          if grep -qE 'Critical|High' vuln.txt; then
            echo "::error::High or critical NuGet vulnerability"
            exit 1
          fi

      # Production dependencies only. A dev-only advisory never reaches a user, and failing on it
      # turns this into noise that people learn to skip — which is how the real ones get missed.
      - name: Vulnerable npm packages
        working-directory: src/frontend/portfolio-web
        run: npm audit --audit-level=high --omit=dev

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The solution builds with warnings as errors and the analyzers enabled, so "it compiles" is
      # already a meaningful gate; no separate lint step is needed.
      - name: Build
        working-directory: src/services/portfolio-api
        run: dotnet build --configuration Release

      - name: Test
        working-directory: src/services/portfolio-api
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/portfolio-web/package-lock.json

      - name: Install
        working-directory: src/frontend/portfolio-web
        run: npm ci

      # Builds from the committed snapshot, so it needs no API and no network — the property
      # ADR-0002 was chosen for.
      - name: Build and prerender
        working-directory: src/frontend/portfolio-web
        run: npm run build

      # A prerendered page that returns an empty root element passes every build check and fails at
      # the only thing prerendering is for. Assert the HTML actually contains content.
      - name: Prerendered pages contain real content
        working-directory: src/frontend/portfolio-web/dist/portfolio-web/browser
        run: |
          set -e
          test -f en/index.html && test -f es/index.html
          test -f en/engineering/index.html && test -f es/ingenieria/index.html
          test -f en/projects/slang/index.html && test -f es/proyectos/slang/index.html
          grep -q 'Sebastián Vélez Ramírez' en/index.html
          grep -q 'Senior .NET Developer' en/index.html
          grep -q 'Desarrollador .NET Senior' es/index.html
          grep -q 'hreflang="es"' en/index.html
          grep -q 'hreflang="en"' es/index.html
          grep -q 'application/ld+json' en/index.html
          echo "prerendered routes: $(find . -name index.html | wc -l)"

  contract:
    name: Content sources agree
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish the API
        working-directory: src/services/portfolio-api
        run: dotnet publish Portfolio.Api/Portfolio.Api.csproj -c Release -o ${{ runner.temp }}/api

      - name: Start both content sources
        working-directory: ${{ runner.temp }}/api
        run: |
          # nohup and redirected output so both survive the end of this step, and so their logs are
          # still readable if a later step fails.
          nohup env ASPNETCORE_URLS=http://localhost:5080 \
            dotnet Portfolio.Api.dll > "$RUNNER_TEMP/api-files.log" 2>&1 &
          nohup env ASPNETCORE_URLS=http://localhost:5081 \
            Portfolio__Database__Enabled=true \
            Portfolio__Database__ConnectionString="Host=localhost;Port=5432;Database=portfolio;Username=portfolio;Password=portfolio" \
            dotnet Portfolio.Api.dll > "$RUNNER_TEMP/api-db.log" 2>&1 &
          curl -sS --retry 40 --retry-delay 2 --retry-connrefused http://localhost:5080/health/live
          curl -sS --retry 40 --retry-delay 2 --retry-connrefused http://localhost:5081/health/ready

      # Two independent implementations of one contract only stay honest if something compares them.
      # This already caught a real disagreement about ordering that no unit test would have found.
      - name: Files and PostgreSQL return the same content
        run: node tools/api/parity-check.mjs

      - name: API logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/api-files.log" "$RUNNER_TEMP/api-db.log"

      # The snapshot the frontend compiles in must still match what the API serves, or the site
      # ships content that no longer exists.
      - name: The committed snapshot is current
        run: |
          node tools/engineering/collect-facts.mjs
          # SKIP_CV rather than `|| true`: swallowing the exit code would also swallow a genuine
          # snapshot failure, and this step exists precisely to catch one.
          API_BASE=http://localhost:5080 SKIP_CV=1 node tools/frontend/build-snapshot.mjs
          git diff --exit-code -- src/frontend/portfolio-web/src/content-snapshot \
            || (echo "::error::The content snapshot is stale. Run npm run content in the frontend and commit." && exit 1)

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [content, api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The CV is generated, not committed, and the web image refuses to build without it. Chrome is
      # already on the runner.
      - name: Build the CVs
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tools/engineering/collect-facts.mjs
          node tools/cv/build-cv.mjs
          mkdir -p src/frontend/portfolio-web/public/cv
          cp dist/cv/Sebastian_Velez_CV_EN_public.pdf src/frontend/portfolio-web/public/cv/Sebastian_Velez_CV_EN.pdf
          cp dist/cv/Sebastian_Velez_CV_ES_public.pdf src/frontend/portfolio-web/public/cv/Sebastian_Velez_CV_ES.pdf

      # Built but not pushed. A registry belongs with a deployment target, and that decision is
      # deliberately deferred to phase 11.
      - name: Build images
        run: docker compose build

      - name: The whole system comes up
        run: |
          set -e
          docker compose up -d
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' portfolio-web 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker compose ps

      - name: Smoke test through nginx
        run: |
          set -e
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1")
            [ "$code" = "$2" ] || { echo "::error::$1 returned $code, expected $2"; exit 1; }
            echo "  ok  $1 → $code"
          }
          check /en/ 200
          check /es/ 200
          check /en/engineering/ 200
          check /es/ingenieria/ 200
          check /en/projects/slang/ 200
          check /cv/Sebastian_Velez_CV_EN.pdf 200
          check "/api/content?lang=es" 200
          # A URL that does not exist must not answer 200 with the home page.
          check /en/definitely-not-a-page 404

          curl -sD - -o /dev/null http://localhost:8080/en/ | grep -qi 'content-security-policy' \
            || { echo "::error::security headers missing on HTML"; exit 1; }
          echo "  ok  security headers present"

      # The site must survive its backend being unavailable — that is the whole argument of
      # ADR-0002, and an argument nobody tests is a hope.
      - name: The site survives the API being down
        run: |
          set -e
          docker compose stop api
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/es/)
          [ "$code" = "200" ] || { echo "::error::site returned $code with the API down"; exit 1; }
          curl -s http://localhost:8080/es/ | grep -q 'años' \
            || { echo "::error::content missing with the API down"; exit 1; }
          echo "  ok  content still served from the embedded snapshot"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
